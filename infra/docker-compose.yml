services:
  redis:
    image: redis:7-alpine
    container_name: cctp-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - cctp-net

  backend:
    build: ../backend
    container_name: cctp-backend
    ports:
      - "3000:3000"
    env_file:
      - ../backend/.env
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - cctp-net

  frontend:
    build: ../frontend
    container_name: cctp-frontend
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - cctp-net

networks:
  cctp-net:
    driver: bridge
