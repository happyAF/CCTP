# 로컬 개발용 docker-compose
# frontend + backend + Redis 를 한 번에 띄워 통합 동작을 검증한다.
#
# 사용법 (일반):
#   docker compose up --build        # 빌드 + 실행 (backend 1개)
#   docker compose down              # 종료
#   docker compose down -v           # 종료 + Redis 데이터(볼륨)까지 삭제
#
# 수평 확장 데모:
#   docker compose up --build --scale backend=3 -d   # backend 3개로 시작
#   docker compose up --scale backend=2 --no-recreate -d  # 실행 중 증설
#
# ⚠️ backend/.env (실제 AWS 키 포함) 는 절대 커밋 금지. env_file 로 주입만 한다.

services:
  redis:
    image: redis:7-alpine
    container_name: cctp-redis
    ports:
      - "6379:6379"          # 호스트에서 redis-cli 로 직접 확인할 때 사용
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    # container_name 고정 제거 → --scale 로 여러 인스턴스 생성 가능
    env_file:
      - ./backend/.env       # PORT, AWS_*, REDIS_URL 등 (gitignore 됨)
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  lb:
    image: nginx:alpine
    container_name: cctp-lb
    ports:
      - "3000:80"            # 외부에서 3000번으로 접근 → nginx가 backend 풀로 분산
    volumes:
      - ./infra/nginx-lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: cctp-frontend
    ports:
      - "8080:80"
    depends_on:
      - lb
    restart: unless-stopped

volumes:
  redis-data:
