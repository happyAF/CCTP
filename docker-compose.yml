# 로컬 개발용 docker-compose
# frontend + backend + Redis 를 한 번에 띄워 통합 동작을 검증한다.
#
# 사용법:
#   docker compose up --build        # 빌드 + 실행
#   docker compose down              # 종료
#   docker compose down -v           # 종료 + Redis 데이터(볼륨)까지 삭제
#
# ⚠️ backend/.env (실제 AWS 키 포함) 는 절대 커밋 금지. env_file 로 주입만 한다.

services:
  redis:
    image: redis:7-alpine
    container_name: cctp-redis
    ports:
      - "6379:6379"          # 호스트에서 redis-cli 로 직접 확인할 때 사용
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: cctp-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env       # PORT, AWS_*, REDIS_URL 등 (gitignore 됨)
    environment:
      # 컨테이너 네트워크에서는 호스트(localhost)가 아닌 서비스명으로 접근.
      # .env 의 REDIS_URL 을 덮어써서 redis 컨테이너를 가리키게 한다.
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy   # Redis 가 ready 된 뒤에 backend 기동
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: cctp-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis-data:
